services:
  middleware-payment:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${APP_NAME:-middleware-payment}:${APP_ENV:-prod}
    container_name: ${APP_NAME}-${APP_ENV}
    # Laravel Octane (web server) + queue worker run in the *same* container.
    # We use supervisord (already installed) to manage both as independent, auto-restarting
    # processes. This prevents queue:work from dying after long uptime, Octane max-requests
    # recycling, OOM kills, or crashes (common problem with plain `command1 & command2 & wait`).
    #
    # The Dockerfile uses multi-stage build: a node stage builds the admin React / backoffice
    # (resources/js/backoffice.jsx via Vite) and the result is copied into the final image.
    # So `docker compose build` always produces a complete image with up-to-date admin UI.
    #
    # DB/Redis can be on the host, in sibling containers (via DB_NETWORK + external-db), or on completely separate servers.
    # DOCKER_*_HOST provides optional remapping inside the container. Network join (when using external Docker networks) is in deploy.sh.
    ports:
      - "${SERVER_PORT}:8000"
    volumes:
      # Source code that changes during development (hot-reload via Octane)
      - ./app:/app/app
      - ./config:/app/config
      - ./database:/app/database
      - ./routes:/app/routes
      - ./resources:/app/resources
      - ./lang:/app/lang
      - ./supervisor:/app/supervisor
      - ./.env:/app/.env
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh
      - ./Caddyfile:/app/Caddyfile
      - ./artisan:/app/artisan
      - ./composer.json:/app/composer.json
      - ./composer.lock:/app/composer.lock
      # Static files from image (no need to mount)
      # vendor/ - from Docker image (composer install during build)
      # public/build/ - from Docker image (npm build during multi-stage)
      - /app/public/build
      - /app/vendor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # DB / Redis host for the container (with optional Docker-context remapping).
      #
      # DOCKER_DB_HOST and DOCKER_REDIS_HOST are OPTIONAL.
      #   - If set, they override the host used *inside the container*.
      #     Use this when DB or Redis run as other Docker containers (set to container name)
      #     or when you need the Docker host (set to host.docker.internal).
      #   - If NOT set, the normal DB_HOST / REDIS_HOST values from your .env are passed through.
      #
      # This design supports the case where database and redis are on completely different servers
      # (remote IPs, not the Docker host, not sibling containers). Just set DB_HOST and REDIS_HOST
      # normally in .env — do not set the DOCKER_*_HOST versions.
      #
      # The DOCKER_*_HOST mechanism is kept for the sibling-container / host-gateway use cases
      # (you don't have to delete the variables).
      - DB_HOST=${DOCKER_DB_HOST:-${DB_HOST:-127.0.0.1}}
      - REDIS_HOST=${DOCKER_REDIS_HOST:-${REDIS_HOST:-127.0.0.1}}
    # We intentionally do not list "external-db" in the networks for this service.
    # See the external-db block below + the conditional logic in deploy.sh.
    networks:
      - middleware-payment

networks:
  middleware-payment:
    driver: bridge # Use the bridge driver (default for container-to-container communication)

  # External network declaration (for DB/Redis in other containers on a shared Docker network).
  # Uses the syntax you asked about:
  external-db:
    external: true
    name: ${DB_NETWORK:-docker_general_resource_default}

  # Why this is "optional" / doesn't break when DB_NETWORK is not set:
  # - The service (above) only attaches to the local `middleware-payment` network.
  # - Actual join to the external network happens in deploy.sh via `docker network connect`
  #   (only when DB_NETWORK or REDIS_NETWORK is set).
  # - When the variable is absent (aaPanel bare metal, host.docker.internal, fully remote servers,
  #   etc.), the name falls back to the default, but because nothing wires to "external-db",
  #   Compose does not require that external network to exist → `up` succeeds with no error.
  #
  # When you *do* set DB_NETWORK=foo, the block uses "foo". deploy.sh will connect the container.
