# ==============================================================================
# Upstream Load Balancer Configuration for Dual Web Containers
# ==============================================================================
# Usage in aaPanel or Host Nginx:
# 1. Include this file in your nginx.conf, or copy this server block to your site config.
# 2. Requests to port 2000 (or your public domain) are load-balanced across Web 1 (2001) and Web 2 (2002).
# ==============================================================================

upstream payment_backend_cluster {
    least_conn;

    server 127.0.0.1:2001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:2002 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

server {
    listen 2000;
    server_name _;

    client_max_body_size 25M;

    # Static assets fallback (if served directly by Nginx on host)
    # location /build/ {
    #     alias /path/to/be_middleware_payment/public/build/;
    #     expires 365d;
    #     access_log off;
    # }

    location / {
        proxy_pass http://payment_backend_cluster;
        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
