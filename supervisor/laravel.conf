[supervisord]
nodaemon=true
user=root
logfile=/app/storage/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
pidfile=/app/storage/logs/supervisord.pid
loglevel=info

# We only use the unix socket (nothing is exposed on the host network).
# You will see one harmless "CRIT Server 'unix_http_server' running without any HTTP
# authentication checking" line at startup — this is normal for supervisor in Docker.
# Keeping it without auth makes `supervisorctl status` / `supervisorctl restart ...`
# work easily from inside the container without extra flags.

[program:octane]
process_name=%(program_name)s
command=php /app/artisan octane:frankenphp --caddyfile=/app/Caddyfile --max-requests=1000 --port=8000
autostart=true
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
priority=1

[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /app/artisan queue:work --queue=default --tries=3 --backoff=30 --timeout=60 --sleep=3 --verbose
numprocs=2
autostart=true
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
priority=2
